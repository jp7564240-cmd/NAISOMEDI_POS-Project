[package]
name = "naisomedi-pos"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.31.0", features = ["bundled-sqlcipher-vendored-openssl"] }
pbkdf2 = "0.12.0"
hmac = "0.12.1"
sha2 = "0.10.8"
sha1 = "0.10.6"
aes-gcm = "0.10.3"
totp-rs = { version = "5.7.2", features = ["gen_secret", "otpauth"] }
rand = "0.8.5"
subtle = "2.5.0"
lazy_static = "1.4.0"
hex = "0.4.3"
